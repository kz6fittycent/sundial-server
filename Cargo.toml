[package]
name = "sundial-server"
description = "Parent web server for Sundial computers"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/kz6fittycent/sundial-server"

[dependencies]
# Local checkout beside this one, until Sundial's protocol crates are published in its
# repository; then a git dependency pinned to a tag.
sundial-core = { path = "../sundial/crates/sundial-core" }
sundial-link = { path = "../sundial/crates/sundial-link" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "signal", "sync"] }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
lto = true
strip = true
