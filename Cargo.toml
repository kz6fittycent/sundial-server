[package]
name = "sundial-server"
description = "Parent web server for Sundial computers"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/kz6fittycent/sundial-server"

[dependencies]
# Pinned commit of Sundial's two-snaps branch; a release tag later.
sundial-core = { git = "https://github.com/kz6fittycent/sundial", rev = "c34a6b610c0905e0c3059cd0608cf8c3ad831232" }
sundial-web = { git = "https://github.com/kz6fittycent/sundial", rev = "c34a6b610c0905e0c3059cd0608cf8c3ad831232" }
sundial-link = { git = "https://github.com/kz6fittycent/sundial", rev = "c34a6b610c0905e0c3059cd0608cf8c3ad831232" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
rpassword = "7"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "signal", "sync"] }
axum = { version = "0.8", features = ["ws", "form"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
qrcodegen = "1.8"

[profile.release]
lto = true
strip = true
