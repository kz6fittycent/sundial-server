name: 🧪 Snap Builds

# One run per push: build, review and try the snap on each architecture, and
# on a push to master that has a new version, upload those same snaps to
# candidate, open a call-for-testing issue and test the store revisions.
# Nothing is built twice.
#
# Nothing goes to the store unless the repository variable
# SUNDIAL_SERVER_STORE_PUBLISH is "true".

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  SNAP_NAME: sundial-server

jobs:
  build:
    # Each architecture is built on its own kind of machine.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - name: Build Snap
        uses: snapcore/action-build@v1
        id: build
        with:
          snapcraft-args: pack

      # The .snap for installing by hand (`sudo snap install --dangerous`),
      # and the file publish-candidate uploads for this architecture.
      - name: Keep the snap
        uses: actions/upload-artifact@v7
        with:
          name: snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
          retention-days: 14

      - name: Snapcraft Review
        uses: diddlesnaps/snapcraft-review-action@v1
        with:
          snap: ${{ steps.build.outputs.snap }}
          isClassic: 'false'

      - name: Try the built snap
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: |
          sudo snap install --dangerous "$SNAP_FILE"
          .github/smoke-test.sh
          snap services "$SNAP_NAME" | grep -q " active "

  # Only a new version is released: a push to master that didn't bump the
  # version (tools/bump_version.sh) is built and checked but not
  # uploaded. Versions count 0.1.0 -> 0.1.1 -> 0.1.2 -> 0.2.0.
  gate:
    needs: [build]
    if: vars.SUNDIAL_SERVER_STORE_PUBLISH == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Checkout Cargo.toml of the built commit
        uses: actions/checkout@v7
        with:
          sparse-checkout: Cargo.toml
          sparse-checkout-cone-mode: false

      - name: Is this version already in the store?
        id: check
        run: |
          version="$(grep -m1 -oP '^version = "\K[^"]+' Cargo.toml)"
          # Every version on any channel. Not in the store yet (404) is fine; any
          # other failed lookup fails the job: better no release than a duplicate.
          status="$(curl -sS --retry 5 --retry-all-errors -o info.json -w '%{http_code}' -H 'Snap-Device-Series: 16' \
            "https://api.snapcraft.io/v2/snaps/info/${SNAP_NAME}?fields=version" || true)"
          case "$status" in
            200) published="$(jq -r '."channel-map"[].version' info.json | sort -u)" ;;
            404) published="" ;;
            *) echo "::error::Store lookup failed (HTTP $status)"; exit 1 ;;
          esac
          echo "Store versions:"; echo "${published:-(none)}"
          # Only a version NEWER than everything in the store goes out, so an
          # older commit's build never replaces a newer candidate.
          newest="$(sort -V <<< "$published" | tail -n1)"
          # And only from the tip of master: a late run for an older push skips.
          tip="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [[ "$tip" != "${{ github.sha }}" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::This commit is no longer the tip of master (${tip:0:7}); not uploading."
          elif [[ -n "$newest" && "$(printf '%s\n%s\n' "$newest" "$version" | sort -V | tail -n1)" != "$version" ]] \
               || [[ "$version" == "$newest" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version ${version} is not newer than the store's ${newest}; not uploading. Bump it with tools/bump_version.sh to release."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Version ${version} is new; publishing to candidate."
          fi

  # One store revision per architecture, from the snap the build job made
  # on that architecture; each leg leaves its revision in a
  # "revision-<arch>" artifact for the jobs below (a matrix job's outputs
  # would only keep one leg's).
  publish-candidate:
    needs: [build, gate]
    if: needs.gate.outputs.publish == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}  # the same on every leg
    steps:
      - name: Checkout the built commit
        uses: actions/checkout@v7

      - name: Determine the app version
        id: version
        run: |
          version="$(grep -m1 -oP '^version = "\K[^"]+' Cargo.toml)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Download the tested snap
        uses: actions/download-artifact@v8
        with:
          name: snap-${{ matrix.arch }}
          path: ${{ runner.temp }}/snap

      - name: Find the snap
        id: build
        run: |
          snap="$(ls "$RUNNER_TEMP"/snap/*.snap)"
          [[ "$(wc -l <<< "$snap")" == 1 ]] || { echo "::error::expected one .snap, found: $snap"; exit 1; }
          echo "snap=$snap" >> "$GITHUB_OUTPUT"

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Upload to the candidate channel
        id: upload
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          # Not "latest/candidate": a `snapcraft export-login` macaroon's
          # channel grant is the bare risk levels (stable/candidate/beta/
          # edge), not track-qualified, so the store rejects the
          # track-prefixed form with invalid-channel-permission.
          output="$(snapcraft upload "${{ steps.build.outputs.snap }}" --release=candidate)"
          echo "$output"

          revision="$(grep -Po 'Revision \K[0-9]+' <<< "$output")"
          if [[ -z "$revision" ]]; then
            echo "Could not parse a revision number out of 'snapcraft upload' output."
            exit 1
          fi
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"

      # security-rebuild.yml rebuilds stable from this tag.
      - name: Record the commit this revision was built from
        run: |
          git tag "snap-rev-${{ steps.upload.outputs.revision }}" "${{ github.sha }}"
          git push origin "snap-rev-${{ steps.upload.outputs.revision }}"

      - name: Leave the revision for the jobs below
        run: echo "${{ steps.upload.outputs.revision }}" > "revision-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: revision-${{ matrix.arch }}
          path: revision-${{ matrix.arch }}

  open-issue:
    needs: publish-candidate
    runs-on: ubuntu-latest
    permissions:
      issues: write
    outputs:
      issue-number: ${{ steps.create.outputs.issue-number }}
      revisions: ${{ steps.revisions.outputs.list }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: revision-*
          merge-multiple: true

      - name: Collect the revisions
        id: revisions
        run: |
          # "1042,1043" for /promote, and "1042 (amd64), 1043 (arm64)" to read.
          list="" readable=""
          for file in revision-*; do
            list+="${list:+,}$(cat "$file")"
            readable+="${readable:+, }$(cat "$file") (${file#revision-})"
          done
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "readable=$readable" >> "$GITHUB_OUTPUT"

      - name: Ensure the call-for-testing label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "call-for-testing" \
            --repo "${{ github.repository }}" \
            --color "FBCA04" \
            --description "Automated candidate build ready for testing" \
            2>/dev/null || true

      - name: Create the call for testing issue
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish-candidate.outputs.version }}
          REVISION: ${{ steps.revisions.outputs.list }}
          READABLE: ${{ steps.revisions.outputs.readable }}
        run: |
          # The "/promote <revision>[,<revision>...] stable [done]" syntax
          # here is what promote-to-stable.yml parses back out of the
          # triggering comment - keep it in sync with the pattern that
          # workflow matches if this changes.
          body=$(cat <<EOF
          A new candidate build of Sundial Server is ready for testing.

          **Version:** ${VERSION}
          **Revisions:** ${READABLE}
          **Channel:** \`latest/candidate\`

          ## How to test

          1. Install or refresh to this build:

             \`\`\`
             sudo snap install ${SNAP_NAME} --channel latest/candidate
             # or, if already installed:
             sudo snap refresh ${SNAP_NAME} --channel latest/candidate
             \`\`\`

          2. Open \`https://<server>:8461/\` from your home network. On a new install, setup makes the parents' logins; after a refresh, your logins and computers are kept.
          3. Check that your computers are online, and try a button.
          4. Add a computer with a pairing code.
          5. An automated test on each architecture will be added to this issue shortly.

          ## How to release it

          Once you're satisfied this revision is good, promote it to stable by commenting:

          \`\`\`
          /promote <revision>[,<revision>...] stable [done]
          \`\`\`

          - \`<revision>\` - the revision number(s) to release (comma-separated for more than one)
          - \`stable\` - required as shown; this command only ever promotes to \`stable\`
          - \`done\` (optional) - also closes this issue once released; leave it off to release and keep the issue open for further testing

          For this build (every architecture), that's:

          \`\`\`
          /promote ${REVISION} stable done
          \`\`\`

          That queues \`promote-to-stable.yml\` (the \`promote-stable\` environment), which runs \`snapcraft release\`.

          ---
          _Opened automatically after a successful build on \`master\`._
          EOF
          )

          url=$(gh issue create \
            --repo "${{ github.repository }}" \
            --title "Call for testing: v${VERSION} (revisions ${REVISION})" \
            --label "call-for-testing" \
            --body "$body")
          echo "issue-number=$(basename "$url")" >> "$GITHUB_OUTPUT"

  # Install the candidate from the store on a clean runner and try it, with
  # a screenshot of the setup page.
  smoke-test:
    needs: [publish-candidate, open-issue]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: revision-${{ matrix.arch }}

      - name: Which revision this architecture got
        id: revision
        run: echo "revision=$(cat "revision-${{ matrix.arch }}")" >> "$GITHUB_OUTPUT"

      - name: Install the candidate revision
        env:
          REVISION: ${{ steps.revision.outputs.revision }}
        run: |
          # Retried: the Snap Store's CDN has had transient failures.
          for attempt in 1 2 3; do
            sudo snap install "${SNAP_NAME}" --revision "${REVISION}" && break
            [[ "$attempt" == 3 ]] && { echo "::error::snap install failed after 3 attempts"; exit 1; }
            sleep 30
          done

      - name: Try it
        run: |
          # Chrome is only on the amd64 runners.
          command -v google-chrome >/dev/null && export SCREENSHOT="$RUNNER_TEMP/setup.png"
          .github/smoke-test.sh 2>&1 | tee "$RUNNER_TEMP/smoke.txt"
          snap services "${SNAP_NAME}" | tee -a "$RUNNER_TEMP/smoke.txt"
          snap services "${SNAP_NAME}" | grep -q " active "

      - name: Publish the screenshot to the screenshots branch
        id: publish
        if: matrix.arch == 'amd64'
        continue-on-error: true
        env:
          REVISION: ${{ steps.revision.outputs.revision }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin screenshots >/dev/null 2>&1; then
            git fetch origin screenshots
            git checkout -B screenshots origin/screenshots
          else
            git checkout --orphan screenshots
            git rm -rf --quiet .
          fi
          dest="revision-${REVISION}"
          mkdir -p "$dest"
          cp "$RUNNER_TEMP/setup.png" "$dest/setup.png"
          git add "$dest"
          git commit -m "Add screenshot for revision ${REVISION}"
          for attempt in 1 2 3; do
            git push origin screenshots && break
            [[ "$attempt" == 3 ]] && { echo "::error::push to the screenshots branch failed"; exit 1; }
            sleep 10
          done
          echo "image=https://raw.githubusercontent.com/${{ github.repository }}/screenshots/${dest}/setup.png" >> "$GITHUB_OUTPUT"

      - name: Comment on the call for testing issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.open-issue.outputs.issue-number }}
          REVISION: ${{ steps.revision.outputs.revision }}
          ALL_REVISIONS: ${{ needs.open-issue.outputs.revisions }}
          IMAGE: ${{ steps.publish.outputs.image }}
        run: |
          picture=""
          [[ -n "$IMAGE" ]] && picture="![Setup page](${IMAGE})"
          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${{ github.repository }}" \
            --body "$(cat <<EOF
          Automated test of revision ${REVISION} (${{ matrix.arch }}), installed fresh from the store:

          \`\`\`
          $(cat "$RUNNER_TEMP/smoke.txt")
          \`\`\`

          ${picture}

          ---

          Looks good? Comment \`/promote ${ALL_REVISIONS} stable done\` on this issue to release every architecture to \`latest/stable\` and close this issue (drop \`done\` to release without closing).
          EOF
          )"

      - name: Comment on the issue if the test failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.open-issue.outputs.issue-number }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${{ github.repository }}" \
            --body "The automated test failed for the ${{ matrix.arch }} revision - see the [workflow run](${run_url}). Check whether it's a store hiccup or a real problem before promoting."
